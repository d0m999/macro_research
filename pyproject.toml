[project]
name = "ft-userdata"
version = "0.1.0"
description = "FreqTrade quantitative trading strategies for Binance futures"
requires-python = ">=3.11,<3.13"

dependencies = [
    # FreqTrade framework (PyPI stopped at 2021.8, install from GitHub stable branch)
    # This brings: numpy, pandas, ccxt, SQLAlchemy, fastapi, uvicorn, ta-lib,
    # technical, pyjwt, python-telegram-bot, requests, and many more
    "freqtrade @ git+https://github.com/freqtrade/freqtrade.git@stable",
    # Additional indicator libraries (not bundled with freqtrade)
    "ft-pandas-ta>=0.3.15",
    # Performance accelerators
    "bottleneck>=1.5.0",
    "numexpr>=2.11.0",
    # Extra networking
    "aiohttp>=3.12.0",
    "cryptography>=45.0.0",
    "certifi>=2025.1.0",
    "httpx>=0.24.1",
    # Utilities not in freqtrade
    "humanize>=4.12.0",
    "joblib>=1.5.0",
    "rich>=14.0.0",
    "pyarrow>=21.0.0; platform_machine != 'armv7l'",
    "pydantic>=2.11.0",
    # Fast JSON
    "orjson>=3.11.0",
    # Date/time
    "pytz>=2025.1",
    # Scheduling & WebSocket
    "schedule>=1.2.0",
    "websockets>=15.0.0",
    "janus>=2.0.0",
    # Misc
    "ast-comments>=1.2.0",
    "packaging>=25.0",
    "psutil>=7.0.0",
    "setuptools>=82.0.0",
]

[tool.uv]
dev-dependencies = []
