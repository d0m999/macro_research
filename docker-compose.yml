---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    
    # 🔒 安全配置 - Security Configuration
    user: "1000:1000"  # 非root用户运行
    read_only: true     # 只读文件系统
    security_opt:
      - no-new-privileges:true  # 禁止提权
    cap_drop:
      - ALL             # 移除所有capabilities
    cap_add:
      - CHOWN           # 仅添加必需的capabilities
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    
    # 🔒 资源限制 - Resource Limits
    deploy:
      resources:
        limits:
          memory: 1G    # 内存限制
          cpus: '0.5'   # CPU限制
        reservations:
          memory: 512M
          cpus: '0.25'
    
    # 🔒 网络安全 - Network Security
    networks:
      - freqtrade_network
    
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "/tmp:/tmp"     # 临时文件目录
      - "freqtrade_logs:/freqtrade/logs"  # 日志卷
    
    # 🔒 加载环境变量文件
    env_file:
      - .env
    
    # 🔒 安全配置: 仅内部暴露端口，通过反向代理访问
    # Security: Only expose internally, access via reverse proxy
    expose:
      - "8081"
    # 如需直接访问，请取消注释下面一行 (仅限本地开发)
    # ports:
    #   - "127.0.0.1:8081:8081"
    
    # 🔒 健康检查 - Health Check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 🔒 使用安全的运行时配置文件
    # Default command using secure runtime configuration
    command: >
      trade
      --logfile /freqtrade/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config_runtime.json
      --strategy SampleStrategy

# 🔒 网络配置 - Network Configuration
networks:
  freqtrade_network:
    driver: bridge
    internal: true      # 内部网络，无外部访问
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 🔒 数据卷 - Volumes
volumes:
  freqtrade_logs:
    driver: local
