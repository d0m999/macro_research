events {
    worker_connections 1024;
}

http {
    # FreqTrade API 代理
    upstream freqtrade_api {
        server freqtrade:8080;  # 容器名:端口
    }
    
    # Grafana 代理
    upstream grafana_ui {
        server grafana:3000;    # 容器名:端口
    }
    
    server {
        listen 80;
        
        # FreqTrade API 路由
        location /api/ {
            proxy_pass http://freqtrade_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Grafana 监控面板路由
        location /grafana/ {
            proxy_pass http://grafana_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # 默认页面
        location / {
            return 200 "Trading System Dashboard\n/api/ - FreqTrade API\n/grafana/ - Monitoring";
            add_header Content-Type text/plain;
        }
    }
}